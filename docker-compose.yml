# ============================================
# PRODUCTION DOCKER COMPOSE FOR EASY-ERP
# ============================================

services:
  # 1. POSTGRESQL DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: easy-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-easyerpshop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easy-erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.3"

  # 2. REDIS CACHE
  redis:
    image: redis:7-alpine
    container_name: easy-erp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-1234}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis_data:/data
    networks:
      - easy-erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1234}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"

  # 3. ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: easy-erp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_JVMFLAGS: "-Xmx64m -Xms64m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - easy-erp-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.3"

  # 4. KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: easy-erp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms128m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - easy-erp-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.4"

  # 5. SPRING BOOT BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easy-erp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/easyerpshop}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-1234}

      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:-1234}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SERVER_PORT: ${SERVER_PORT:-9090}

      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/uploads}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9090}

      JWT_SECRET: ${JWT_SECRET:-easy_erp_shop_jwt_secret_32_characters_long_key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-easy_erp_shop_encrypt_key_32_chars}

      INIT_DATASOURCE_URL: ${INIT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/postgres}
      INIT_DATASOURCE_USERNAME: ${INIT_DATASOURCE_USERNAME:-postgres}
      INIT_DATASOURCE_PASSWORD: ${INIT_DATASOURCE_PASSWORD:-1234}

      JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - easy-erp-network
    ports:
      - "${SERVER_PORT_HOST:-9091}:${SERVER_PORT:-9090}"  # <--- Host 9091 → Container 9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-9090}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # 6. FRONTEND (Vue.js)
  frontend:
    build:
      context: ./frontend   # Path to your frontend folder
      dockerfile: Dockerfile
    container_name: easy-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - easy-erp-network
    ports:
      - "${FRONTEND_PORT:-80}:80"   # Host:Container port
    environment:
      VUE_APP_API_URL: ${SPRING_DATASOURCE_URL:-http://localhost:9091}

# ============================================
# NETWORKS
# ============================================
networks:
  easy-erp-network:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  uploads_data:
