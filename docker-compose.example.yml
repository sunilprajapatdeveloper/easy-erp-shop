# PRODUCTION DOCKER COMPOSE FOR EASY-ERP
services:
  # POSTGRESQL DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: easy-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easy-erp-network

  # REDIS CACHE
  redis:
    image: redis:7-alpine
    container_name: easy-erp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - easy-erp-network

  # ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: easy-erp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - easy-erp-network

  # KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: easy-erp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - easy-erp-network

  # BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: easy-erp-backend
    restart: unless-stopped

    depends_on:
      - postgres
      - redis
      - kafka

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}

      STORAGE_ACTIVE: ${STORAGE_ACTIVE}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      SERVER_PORT: ${SERVER_PORT}

    ports:
      - "${SERVER_PORT_HOST}:${SERVER_PORT}"

    volumes:
      - uploads_data:/app/uploads

    networks:
      - easy-erp-network

  # FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: easy-erp-frontend
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      VUE_APP_API_URL: ${VUE_APP_API_URL}

    ports:
      - "${FRONTEND_PORT}:80"

    networks:
      - easy-erp-network

  # OLLAMA (OPTIONAL)
  ollama:
    image: ollama/ollama:latest
    container_name: easy-erp-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    environment:
      OLLAMA_HOST: 0.0.0.0

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - easy-erp-network

# NETWORKS
networks:
  easy-erp-network:
    driver: bridge

# VOLUMES
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  uploads_data:
  ollama_data: