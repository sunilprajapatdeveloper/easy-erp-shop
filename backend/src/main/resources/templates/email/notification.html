<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${title} - ${companyName}</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        margin: 0;
        padding: 20px;
        background-color: #f5f7fa;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .header {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }
      .company-name {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .content {
        padding: 40px 30px;
      }
      .message-box {
        background: #f8f9fa;
        border-left: 4px solid #4facfe;
        padding: 25px;
        margin: 25px 0;
        border-radius: 4px;
      }
      .footer {
        background: #f8f9fa;
        padding: 25px 30px;
        text-align: center;
        color: #6c757d;
        font-size: 14px;
        border-top: 1px solid #e9ecef;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="company-name">${companyName}</div>
        <h1 style="margin: 10px 0 0 0; font-size: 24px">${title}</h1>
      </div>
      <div class="content">
        <div class="message-box">${message}</div>
        <p style="margin-top: 30px">
          Best regards,<br />
          <strong>The ${companyName} Team</strong>
        </p>
      </div>
      <div class="footer">
        <p>© ${currentYear} ${companyName}. All rights reserved.</p>
        <p>This is an automated notification.</p>
      </div>
    </div>
  </body>
</html>
