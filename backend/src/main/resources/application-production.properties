# Thumbnail configuration
storage.thumbnail.enabled=true
storage.thumbnail.width=200
storage.thumbnail.height=200
storage.thumbnail.quality=0.8

storage.s3.enabled=${STORAGE_S3_ENABLED:false}
storage.azure.enabled=${STORAGE_AZURE_ENABLED:false}
storage.gcs.enabled=${STORAGE_GCS_ENABLED:false}

# ===============================
