# =================================================
# PRODUCTION (Docker / DigitalOcean)
# =================================================

# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/easyerpshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# ===============================
# REDIS
# ===============================
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ===============================
# JWT & SECURITY
# ===============================
jwt.secret=${JWT_SECRET:ChangeThisJWTSecretInProduction123!}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ===============================
# INIT / ADMIN DATABASE
# ===============================
init.datasource.url=${INIT_DATASOURCE_URL:jdbc:postgresql://postgres:5432/postgres}
init.datasource.username=${INIT_DATASOURCE_USERNAME:postgres}
init.datasource.password=${INIT_DATASOURCE_PASSWORD:postgres123}

# ===============================
# MAIL (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# RAZORPAY
# ===============================
razorpay.key=${RAZORPAY_KEY:}
razorpay.secret=${RAZORPAY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ===============================
# STORAGE
# ===============================
# Added this to prevent NullPointer on StorageService
storage.active=${STORAGE_ACTIVE:LOCAL}
storage.local.base-path=${STORAGE_LOCAL_PATH:/app/uploads}
storage.local.public-url-prefix=${STORAGE_PUBLIC_URL:http://localhost:9090}

storage.s3.enabled=${STORAGE_S3_ENABLED:false}
storage.azure.enabled=${STORAGE_AZURE_ENABLED:false}
storage.gcs.enabled=${STORAGE_GCS_ENABLED:false}

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.easyerpshop=WARN
logging.file.name=${LOG_FILE_PATH:/app/logs/application.log}
