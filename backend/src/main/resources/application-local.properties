# ===============================
# VERIFICATION SYSTEM CONFIGURATION
# ===============================

# Verification Properties
verification.token.default-expiry=PT15M
verification.token.default-max-attempts=5
verification.token.length=32

verification.security.cooldown-period=PT5M
verification.security.max-requests-per-hour=10
verification.security.enable-ip-rate-limiting=true

verification.cleanup.retention-period=P90D
verification.cleanup.cron=0 0 2 * * ?

# Email Configuration
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Retry Configuration
spring.retry.enabled=true

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100