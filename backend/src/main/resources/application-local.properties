# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easyerpshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ===============================
# REDIS
# ===============================
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:12345678}

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=verification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.missing-topics-fatal=false

# Kafka Topics
kafka.topics.verification-email=verification-email
kafka.consumer-groups.verification=verification-group

# ===============================
# JWT & SECURITY
# ===============================
jwt.secret=${JWT_SECRET:MySuperSecretKeyThatIsAtLeast32CharactersLong}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ===============================
# SERVER & STORAGE
# ===============================
server.port=${SERVER_PORT:9090}
storage.active=${STORAGE_ACTIVE:LOCAL}
storage.local.base-path=${STORAGE_LOCAL_PATH:./uploads}
storage.local.public-url-prefix=${STORAGE_PUBLIC_URL:http://localhost:9090}

# Disable other storage providers by default
storage.s3.enabled=false
storage.azure.enabled=false
storage.gcs.enabled=false

